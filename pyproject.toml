[project]
name = "nccn-guidelines"
version = "0.2.0"
description = "Bounded dual-site NCCN Guidelines MCP plugin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "brotli>=1.1.0",
    "bs4>=0.0.2",
    "httpx>=0.28.1",
    "mcp[cli]>=1.11.0",
    "pypdf>=5.8.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
nccn-guidelines-mcp = "nccn_guidelines.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
